# Tataiya Production Nginx Configuration
# Domain: tataiya.in
# Save this as /etc/nginx/sites-available/tataiya on your Ubuntu server
# Then enable with: sudo ln -sf /etc/nginx/sites-available/tataiya /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload nginx: sudo systemctl reload nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name tataiya.in www.tataiya.in;
    return 301 https://$host$request_uri;
}

# HTTPS Server Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name tataiya.in www.tataiya.in;

    # SSL Certificates - Let's Encrypt will auto-configure these
    ssl_certificate /etc/letsencrypt/live/tataiya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tataiya.in/privkey.pem;

    # SSL Security Settings (strong)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Increase client_max_body_size to match your Fastify server limit (2GB)
    client_max_body_size 2G;

    # Increase buffer sizes for large requests
    client_body_buffer_size 128k;

    # Timeouts to handle large file uploads
    client_header_timeout 300s;
    client_body_timeout 300s;
    send_timeout 300s;

    # Serve Admin Panel / public site static files (Vite production build)
    location / {
        root /var/www/tataiya/admin-panel/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Fastify backend (API endpoints)
    # IMPORTANT: do NOT use "proxy_pass http://127.0.0.1:3000/;" (trailing slash)
    # That strips /api and breaks routes. Keep the full URI including /api.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        proxy_temp_file_write_size 64m;
    }

    # S3-backed media: old clients saved https://tataiya.in/uploads/media/...
    # Redirect those to the public S3 bucket so images still load.
    location /uploads/media/ {
        rewrite ^/uploads/(.*)$ https://tatiyatv.s3.eu-north-1.amazonaws.com/$1 permanent;
    }

    # Local-only uploads (non-media), if any
    location /uploads/ {
        alias /home/ubuntu/tataiya-api-server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}

